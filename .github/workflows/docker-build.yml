name: Build and Push Docker Image
on:
  push:
    branches:
      - main
      - master


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Nepremicnine_RGIS/Nepremicnine_RGIS.csproj

      - name: Build
        run: dotnet build Nepremicnine_RGIS/Nepremicnine_RGIS.csproj --configuration Release --no-restore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Nepremicnine_RGIS/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nepremicnine_rgis:latest
            ${{ secrets.DOCKER_USERNAME }}/nepremicnine_rgis:${{ github.sha }}

