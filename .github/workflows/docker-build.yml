name: Build and Push Docker Image
on:
  push:
    branches:
      - main
      - master

env:
  AZURE_WEBAPP_NAME: nepremicnine-rgis
  IMAGE_NAME: nepremicnine_rgis

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Nepremicnine_RGIS.Tests

      - name: Build
        run: dotnet build Nepremicnine_RGIS.Tests --configuration Release --no-restore

      - name: Run MSTest Tests 
        run: >
          dotnet test Nepremicnine_RGIS.Tests
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults
      
      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: MSTest rezultati
          path: TestResults/*.trx
          reporter: dotnet-trx
      
      - name: Coverage report
        uses: danielpalme/ReportGenerator-Github-Action@v5
        if: always()
        with: 
          reports: TestResults/**/*.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInLine;MarkdownSummaryGithub

      - name: CoverageSummary
        if: always()
        run: cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:  
          name: test-results
          path: |
            TestResults
            CoverageReport

      - name: Restore
        run: dotnet restore Nepremicnine_RGIS/Nepremicnine_RGIS.csproj

      - name: Build
        run: dotnet build Nepremicnine_RGIS/Nepremicnine_RGIS.csproj --configuration Release --no-restore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Nepremicnine_RGIS/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: index.docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        

